<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body>
    <div id="map" style="height:512px; width:512px; border:1px solid grey; padding:5px"></div>
    <button id="button-left"></button>
    <button id="button-right"></button>
    <input  id="date1" type="date"></input>
    <input  id="date2" type="date"></input>
    <input  id="red"   type="number"></input>
    <input  id="green" type="number"></input>
    <input  id="blue"  type="number"></input>
    <button id="update">Update</button>

<script>
let date1 = "2026-01-01";
let date2 = "2026-01-10";
let east = -60;
let west = east + 180;
let rd = 220;
let gn = 100;
let bl = 100;

let key = "fdd1226f814f7d92826c2dbd951f2b2e";

$("#date1").val(date1)
$("#date2").val(date2)
$("#red").val(rd)
$("#green").val(gn)
$("#blue").val(bl)
update_map(east, west, date1, date2, rd, gn, bl);

function update_map(east, west, date1, date2, rd, gn, bl) {
    let src = `https://firms.modaps.eosdis.nasa.gov/mapserver/wms/fires/${key}?REQUEST=GetMap&layers=fires_modis&COLORS=${rd}+${gn}+${bl}&TIME=${date1}/${date2}&WIDTH=512&HEIGHT=512&BBOX=${east},-90,${west},90`;
    $("#map").html(`<img src="${src}"></img>`)
}

$("#button-left").click(function() {
    east -= 10;
    west = east + 180;
    update_map(east, west, date1, date2, rd, gn, bl);
    if (east <= -180) {
        this.disabled = true;
    }
    if ($("#button-right").prop("disabled"))
        $("#button-right").prop("disabled", false);
})

$("#button-right").click(function() {
    east += 10;
    west = east + 180;
    update_map(east, west, date1, date2, rd, gn, bl);
    if (east >= 0) {
        this.disabled = true;
    }
    if ($("#button-left").prop("disabled"))
        $("#button-left").prop("disabled", false);
})

$("#update").click(function() {
    date1 = $("#date1").val();
    date2 = $("#date2").val();
    rd = $("#red").val();
    gn = $("#green").val();
    bl = $("#blue").val();
    update_map(east, west, date1, date2, rd, gn, bl);
})

</script>
</body>
</html>
